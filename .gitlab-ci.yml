stages:
  - test
  - build
  - deploy

variables:
  DJANGO_SETTINGS_MODULE: contractcommand.settings
  USE_MYSQL: "False"  # Use SQLite for CI

# ─── Test Stage ──────────────────────────────────────────────
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py migrate --run-syncdb
    - python manage.py test --verbosity=2
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ─── Build Stage ─────────────────────────────────────────────
build:
  stage: build
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - python manage.py collectstatic --noinput
    - echo "Static assets collected successfully for ContractCommand deployment"
  artifacts:
    paths:
      - staticfiles/
    expire_in: 1 week
  only:
    - main
    - develop

# ─── Deploy Stage (Staging) ──────────────────────────────────
deploy-staging:
  stage: deploy
  image: python:3.11-slim
  environment:
    name: staging
    url: https://contractcommand-staging.defense.gov.in
  script:
    - echo "Deploying ContractCommand to Staging Environment"
    - echo "Applying database migrations on staging server"
  only:
    - develop
  when: manual

# ─── Deploy Stage (Production) ───────────────────────────────
deploy-production:
  stage: deploy
  image: python:3.11-slim
  environment:
    name: production
    url: https://contractcommand.defense.gov.in
  script:
    - echo "Deploying ContractCommand to Defense Production"
    - echo "ITAR-restricted secure deployment pipeline executing"
  only:
    - main
  when: manual
  allow_failure: false
